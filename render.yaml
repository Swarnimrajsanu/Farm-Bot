services:
  # Backend - FastAPI
  - type: web
    name: farmbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /
    plan: free

  # Frontend - Next.js
  - type: web
    name: farmbot-frontend
    runtime: node
    rootDir: frontend-next
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        sync: false   # Fill this in after backend is deployed
    plan: free
